<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Iqish 💗</title>
<style>
:root{--bg1:#ffe3ec;--bg2:#ffc2d6;--ink:#7a1f45;--card:#fffafc;--env:#ff7aa8;--env2:#ff5c93;--accent:#e8336d}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.fx{position:fixed;top:-40px;pointer-events:none;z-index:50;animation:fall linear forwards}
.up{top:auto;bottom:-40px;animation-name:rise}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.9}}
@keyframes rise{to{transform:translateY(-112vh) rotate(25deg);opacity:0}}
#intro{position:fixed;inset:0;z-index:40;background:#1b0a14;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .8s,visibility .8s}
#intro.hide{opacity:0;visibility:hidden}
#big{font-size:min(20vw,110px);margin:0;color:#ff8fb5;font-style:italic;transition:transform .3s}
#small{font-size:18px;margin-top:14px;opacity:.9;max-width:300px;line-height:1.4}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.wrap{position:relative;width:min(88vw,340px);height:330px}
.env{position:absolute;inset:80px 0 0;background:var(--env);border-radius:10px;box-shadow:0 14px 30px rgba(180,40,90,.35)}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,transparent 49%,var(--env2) 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49%,var(--env2) 50%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;right:0;top:80px;height:110px;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s,z-index 0s .35s;z-index:3}
.seal{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-size:34px;z-index:4;transition:opacity .3s}
.card{position:absolute;left:12px;right:12px;top:120px;min-height:190px;background:var(--card);border-radius:14px;padding:20px 16px;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:2;transition:transform .9s .4s;display:flex;flex-direction:column;justify-content:center;align-items:center}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0}
.open .card{transform:translateY(-110px);z-index:5}
h1{margin:0 0 8px;font-size:30px;color:var(--accent);font-weight:normal;font-style:italic}
#msg{margin:0;font-size:16px;line-height:1.5;min-height:72px;transition:opacity .3s}
.row{display:flex;gap:8px;margin-top:10px}
button{border:0;background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
@media (prefers-color-scheme:dark){:root{--bg1:#2a0f1c;--bg2:#4a1730;--ink:#ffd6e5;--card:#3a1426;--env:#d8497d;--env2:#b83a68;--accent:#ff8fb5}button{color:#2a0f1c}button.alt{color:var(--accent)}}
</style>
</head>
<body>
<div id="intro"><p id="big"></p><div id="small"></div></div>
<div class="wrap" id="wrap">
  <div class="env"></div>
  <div class="flap"></div>
  <div class="seal">💗</div>
  <div class="card">
    <h1>Iqish cantik 💗</h1>
    <p id="msg"></p>
    <div class="row"><button id="next" type="button">Lagi ✨</button><button id="again" type="button" class="alt">Ulangi 🔁</button></div>
  </div>
</div>
<script>
var msgs=[
"Iqish cantik banget, sampai Google Maps nyasar ke hatiku 🗺️",
"Kamu itu kayak WiFi: kalau nggak ada, hidupku langsung lemot 📶",
"Kalau kamu jadi kuota, aku rela habis-habisan 😆",
"Jangan senyum terus, nanti aku kena diabetes 🍬",
"Kamu bikin aku lupa cara hemat. Traktir kamu terus deh 🍜",
"Pacarku cantik, ngambek pun tetap lucu. Tapi jangan lama-lama ya 😝",
"Katanya jodoh itu cerminan diri. Berarti aku juga ganteng dong? 😎",
"Aku bukan Spiderman, tapi aku selalu nempel sama kamu 🕷️",
"Terima kasih sudah sabar sama aku. Aku sayang kamu, Iqish 💕"
];
var wrap=document.getElementById("wrap"),msg=document.getElementById("msg"),intro=document.getElementById("intro"),big=document.getElementById("big"),small=document.getElementById("small"),i=0,timers=[];
function fx(list,n,up){for(var k=0;k<n;k++){var e=document.createElement("div");e.className="fx"+(up?" up":"");e.textContent=list[Math.floor(Math.random()*list.length)];e.style.left=Math.random()*100+"vw";e.style.fontSize=(16+Math.random()*24)+"px";e.style.animationDuration=(3+Math.random()*4)+"s";document.body.appendChild(e);(function(x){setTimeout(function(){x.remove()},7500)})(e)}}
function show(a,b){big.textContent=a;small.textContent=b||"";big.classList.remove("pop");void big.offsetWidth;big.classList.add("pop")}
function at(ms,f){timers.push(setTimeout(f,ms))}
function play(){
  timers.forEach(clearTimeout);timers=[];
  wrap.classList.remove("open");msg.textContent="";i=0;
  intro.classList.remove("hide");
  show("👀","Psst... ada kejutan buat Iqish");
  at(2200,function(){show("3","Siap-siap ya...")});
  at(3200,function(){show("2","Jangan ngintip! 🙈")});
  at(4200,function(){show("1","Tahan napas... 😤")});
  at(5200,function(){show("🎉","SURPRISE!!!");fx(["🎉","🎊","💗","✨","🌸"],60,false)});
  at(6800,function(){intro.classList.add("hide");});
  at(7300,function(){wrap.classList.add("open");msg.textContent=msgs[0];fx(["💗","💖","💕"],24,true)});
}
document.getElementById("next").onclick=function(){i=(i+1)%msgs.length;msg.style.opacity=0;setTimeout(function(){msg.textContent=msgs[i];msg.style.opacity=1},250);fx(["💗","💖","🤣"],10,true)};
document.getElementById("again").onclick=play;
play();
</script>
</body>
</html>
